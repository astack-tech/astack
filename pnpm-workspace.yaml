packages:
  - 'packages/*'
  - 'examples/*'
  - 'tools/*'

overrides:
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11.0.1. Releases 10.x share the 11.x
  # interface and move to it directly.
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
  # TypeDoc calls Minimatch#matchOne, which minimatch 11 made private. The compat package
  # provides it on top of minimatch 11 (see tools/minimatch-compat).
  typedoc>minimatch: link:./tools/minimatch-compat
