<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title"><title id="title">AStack logo skeleton: three components, port bridge, open apex, modular construction</title><rect width="1400" height="850" fill="#09090b"/><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bfc0c7" stroke-opacity=".09"/></pattern></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="64" y="70" fill="#f4f4f5" font-family="Arial,sans-serif" font-size="30">Composition, made visible.</text><text x="64" y="104" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="16">AStack / symbol construction and design rationale</text><g transform="translate(140 200) scale(4)" fill="#f4f4f5"><path d="M48 16H62L30 96H16Z"/><path d="M66 16H80L112 96H98Z"/><path d="M46 68H82L88 82H40Z"/><g fill="none" stroke="#bfc0c7" stroke-width=".3"><path d="M0 16H128M0 68H128M0 82H128M0 96H128M16 0V112M48 0V112M62 0V112M66 0V112M80 0V112M112 0V112"/><path d="M20 110L64 0L108 110" stroke-dasharray="1 1"/></g></g><g font-family="Arial,sans-serif" fill="#f4f4f5"><text x="820" y="240" font-size="24">01 / Compose</text><text x="820" y="274" font-size="17" fill="#a1a1aa">Three discrete solids. One shared grammar.</text><text x="820" y="378" font-size="24">02 / Connect</text><text x="820" y="412" font-size="17" fill="#a1a1aa">The bridge expresses a port-to-port contract.</text><text x="820" y="516" font-size="24">03 / Flow</text><text x="820" y="550" font-size="17" fill="#a1a1aa">An open apex. A system that can keep growing.</text></g><path d="M680 270H782M620 490H782M430 178H782V530" stroke="#bfc0c7" stroke-width="1" fill="none"/><text x="64" y="760" fill="#bfc0c7" font-family="monospace" font-size="15">128 × 112 units / 3 parts / 4-unit apex gap / 14-unit crossbar</text><text x="64" y="798" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="16">The component stays simple. The composition creates the capability.</text></svg>
