# The website is its own pnpm workspace root, separate from the packages workspace.
# This keeps pnpm (and Dependabot) on website/pnpm-lock.yaml when run in this folder.
packages:
  - '.'

# Patched releases of vulnerable transitive dependencies, kept within the same major
# version that the parent package expects. Remove an entry once the parent ships the fix.
overrides:
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11.0.1. Releases 10.x share the 11.x
  # interface and move to it directly. The ESLint plugins below call minimatch 3, whose
  # export is the match function; ../tools/minimatch-compat provides that interface on
  # top of minimatch 11.
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
  eslint-plugin-import>minimatch: file:../tools/minimatch-compat
  eslint-plugin-jsx-a11y>minimatch: file:../tools/minimatch-compat
  eslint-plugin-react>minimatch: file:../tools/minimatch-compat
  picomatch@<2.3.2: ^2.3.2
  source-map-js@<1.2.2: ^1.2.2
