<!doctype html>
<!-- Source of github-social-preview.png (1280 x 640). Open in a browser at 1280 x 640 and take a screenshot to regenerate it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(../../website/app/fonts/Geist-Latin.woff2) format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        background: #09090b;
        color: #f4f4f5;
        font-family: Geist, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .board {
        display: grid;
        grid-template-columns: 448px 1fr;
        grid-template-rows: 1fr 72px;
        gap: 8px;
        padding: 24px;
        height: 640px;
      }
      .tile {
        background: #131316;
      }
      .mark {
        display: grid;
        place-items: center;
      }
      .mark img {
        width: 232px;
        height: auto;
      }
      .text {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 44px 48px;
      }
      .name {
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .tag {
        font-size: 76px;
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }
      .desc {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.35;
        color: #c6c6ce;
        letter-spacing: -0.01em;
      }
      .strip {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(6, 1fr) 2fr;
        gap: 8px;
      }
      .strip span {
        display: block;
      }
      .url {
        background: #f4f4f5;
        color: #09090b;
        display: flex;
        align-items: center;
        padding: 0 24px;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="tile mark"><img src="logo.svg" /></div>
      <div class="tile text">
        <div class="name">astack</div>
        <div>
          <div class="tag">Everything is<br />a component.</div>
          <div class="desc">A composable framework for building AI applications.</div>
        </div>
      </div>
      <div class="strip">
        <span style="background: color-mix(in oklab, oklch(0.86 0.008 260) 30%, #131316)"></span>
        <span style="background: color-mix(in oklab, oklch(0.72 0.13 258) 30%, #131316)"></span>
        <span style="background: color-mix(in oklab, oklch(0.76 0.11 205) 30%, #131316)"></span>
        <span style="background: color-mix(in oklab, oklch(0.77 0.12 158) 30%, #131316)"></span>
        <span style="background: color-mix(in oklab, oklch(0.8 0.12 78) 30%, #131316)"></span>
        <span style="background: color-mix(in oklab, oklch(0.72 0.13 18) 30%, #131316)"></span>
        <div class="url">astack.tech</div>
      </div>
    </div>
  </body>
</html>
