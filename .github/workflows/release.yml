name: Release

# On every push to master, changesets either opens or updates the "Version packages"
# pull request (when changesets are pending), or, after that pull request is merged,
# publishes the new versions with npm Trusted Publishing (OIDC, with provenance).
# npm must list this repository and this file as the trusted publisher of each package.
# The pull request is opened by the astack-release-bot GitHub App (RELEASE_APP_ID
# variable, RELEASE_APP_PRIVATE_KEY secret), so its CI checks run.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; dist-tag over OIDC needs 11.21.
      - run: npm install --global npm@^11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pull requests opened with GITHUB_TOKEN do not start other workflows, so the
      # "Version packages" pull request would never get its required CI checks. The
      # astack-release-bot GitHub App opens it instead, with a token that expires in
      # an hour and may only write contents and pull requests of this repository.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # changesets/action v2 is the release line for Changesets v3 (the version this repo
      # uses, with its .changeset/pre/ folder). Tags and GitHub releases come from
      # scripts/publish-packages.mjs, so the action creates neither.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Until the first stable release, `npm install` without a tag gets the newest beta.
          LATEST_FOLLOWS_PRERELEASE: 'true'
