name: Release

# On every push to master, changesets either opens or updates the "Version packages"
# pull request (when changesets are pending), or, after that pull request is merged,
# publishes the new versions with npm Trusted Publishing (OIDC, with provenance).
# npm must list this repository and this file as the trusted publisher of each package.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; dist-tag over OIDC needs 11.21.
      - run: npm install --global npm@^11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Until the first stable release, `npm install` without a tag gets the newest beta.
          LATEST_FOLLOWS_PRERELEASE: 'true'
