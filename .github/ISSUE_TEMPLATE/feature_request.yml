name: Feature request
description: Propose a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show how the API would look in code.
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
